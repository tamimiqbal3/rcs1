<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #d32f2f; --dark-red: #8e0000; --white: #ffffff; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--white); width: 100%; max-width: 480px; padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--red); animation: fadeInUp 0.6s ease; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--red); margin: 0; font-size: 28px; }
        .est { display: inline-block; background: #ffebee; color: var(--red); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 5px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #444; }
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--red); }

        .radio-options { display: flex; gap: 15px; background: #fafafa; padding: 10px; border-radius: 10px; border: 1px dashed #ccc; }
        button { width: 100%; padding: 14px; background: linear-gradient(to right, var(--red), var(--dark-red)); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        #success-ui { display: none; text-align: center; }
        .check-mark { width: 60px; height: 60px; background: #e8f5e9; color: #2e7d32; font-size: 30px; line-height: 60px; border-radius: 50%; margin: 0 auto 15px; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="form-box">
        <header>
            <h1>RCS 200 Years</h1>
            <span class="est">Established in 1828</span>
        </header>

        <form id="rcsForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="Email" required>
            </div>
            <div class="form-group">
                <label>Identify Yourself</label>
                <div class="radio-options">
                    <label style="font-size:13px"><input type="radio" name="Status" value="Alumnus" checked> Alumnus</label>
                    <label style="font-size:13px"><input type="radio" name="Status" value="Current Student"> Student</label>
                </div>
            </div>
            <div class="form-group">
                <label>Batch Year</label>
                <select name="Batch" id="yearPicker" required></select>
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" name="WhatsApp" placeholder="+880" required>
            </div>
            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" name="Contact" required>
            </div>
            <button type="submit" id="submitBtn">Submit Now</button>
        </form>
    </div>

    <div id="success-ui">
        <div class="check-mark">✓</div>
        <h2>Submission Complete!</h2>
        <p style="color:#666; font-size: 14px;">Thanks for filling out the form. <br><b>Our support team will email you soon and add you to our official WhatsApp group.</b></p>
    </div>
</div>

<script>
    const select = document.getElementById('yearPicker');
    for (let i = 2035; i >= 1955; i--) {
        let opt = document.createElement('option');
        opt.value = i; opt.innerHTML = i;
        select.appendChild(opt);
    }

    // paste your URL here
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzbnkg5kk3HvSM3ofbo7CcAu_7aFKKL-fBKpr03bifan95EAM770N9rlf4qnwR9TLrc/exec'; 
    const form = document.getElementById('rcsForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = "Submitting...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(res => {
                document.getElementById('form-box').style.display = 'none';
                document.getElementById('success-ui').style.display = 'block';
            })
            .catch(err => {
                alert("Error! Check internet or Script URL.");
                btn.disabled = false;
                btn.innerHTML = "Submit Now";
            });
    });
</script>
</body>
</html>
