<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS</title>
    <!-- Adding a font from Google Fonts for a better look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #d32f2f;
            --dark-red: #8e0000;
            --white: #ffffff;
            --bg: #f2f2f2;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Entrance Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-top: 12px solid var(--red);
            animation: fadeInUp 0.8s ease-out; /* Applying the animation */
            position: relative;
            overflow: hidden;
        }

        /* Subtle background design element */
        .container::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: var(--red);
            opacity: 0.05;
            border-radius: 50%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--red);
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .est {
            display: inline-block;
            background: #ffebee;
            color: var(--red);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--red);
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.2);
        }

        .radio-options {
            display: flex;
            gap: 20px;
            background: #fafafa;
            padding: 10px;
            border-radius: 12px;
            border: 1px dashed #ccc;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, var(--red), var(--dark-red));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3);
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(211, 47, 47, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Success UI */
        #success-ui {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: fadeInUp 0.5s ease;
        }

        .check-mark {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 40px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        h2 { color: #2e7d32; margin-bottom: 10px; }
        .msg-text { color: #666; line-height: 1.6; font-size: 15px; }

        @media (max-width: 480px) {
            .container { padding: 25px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="form-box">
        <header>
            <h1>RCS 200 Years</h1>
            <span class="est">Established in 1828</span>
        </header>

        <form id="rcsForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Name" placeholder="e.g. Tamim Iqbal" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="Email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Identify Yourself</label>
                <div class="radio-options">
                    <label class="radio-item"><input type="radio" name="Status" value="Alumnus" checked> Alumnus</label>
                    <label class="radio-item"><input type="radio" name="Status" value="Current Student"> Student</label>
                </div>
            </div>

            <div class="form-group">
                <label>Batch Year</label>
                <select name="Batch" id="yearPicker" required></select>
            </div>

            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" name="WhatsApp" placeholder="+88017XXXXXXXX" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" name="Contact" placeholder="Emergency Phone" required>
            </div>

            <button type="submit" id="submitBtn">Submit Now</button>
        </form>
    </div>

    <div id="success-ui">
        <div class="check-mark">✓</div>
        <h2>Submission Complete!</h2>
        <p class="msg-text">
          Thanks for filling out the form.<br> 
            <b>Our support team will email you soon and add you to our official WhatsApp group.</b>
        </p>
    </div>
</div>

<script>
    // Populate Years
    const select = document.getElementById('yearPicker');
    for (let i = 2035; i >= 1955; i--) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = i;
        select.appendChild(opt);
    }

    // Handle Form Submission
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxThxkRXrF-v8wIxgA3GJBTcFwPHP_6IF3OEtE5WqZgefH4cyIDCEP7UGZD-Jgnb5pQ/exec';
    const form = document.getElementById('rcsForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = "Sending Data...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                document.getElementById('form-box').style.display = 'none';
                document.getElementById('success-ui').style.display = 'block';
            })
            .catch(error => {
                alert('Error! Data not sent. Please check connection.', error.message);
                btn.disabled = false;
                btn.innerHTML = "Submit Now";
            });
    });
</script>

</body>
</html>
