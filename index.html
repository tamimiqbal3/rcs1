<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS 200 Years Celebration</title>
    <style>
        :root {
            --red: #c62828;
            --white: #ffffff;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 10px solid var(--red);
            margin: 20px;
        }

        h1 {
            color: var(--red);
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            text-transform: uppercase;
        }

        p.intro {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--red);
            outline: none;
        }

        .radio-options {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #a51d1d;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Success Message Area */
        #response-section {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .success-icon {
            font-size: 60px;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Registration Form Section -->
    <div id="form-section">
        <h1>RCS 200 Years</h1>
        <p class="intro">Please fill out the form to join the celebration!</p>
        
        <form id="registrationForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="Email" placeholder="yourname@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Are you an Alumnus or Current Student?</label>
                <div class="radio-options">
                    <label class="radio-item"><input type="radio" name="Status" value="Alumnus" checked> Alumnus</label>
                    <label class="radio-item"><input type="radio" name="Status" value="Current Student"> Current Student</label>
                </div>
            </div>

            <div class="form-group">
                <label>Batch Year</label>
                <select name="Batch" id="batchSelect" required>
                    <option value="" disabled selected>Select Year</option>
                </select>
            </div>

            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" name="WhatsApp" placeholder="+880..." required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" name="Contact" placeholder="Phone number" required>
            </div>

            <button type="submit" id="submitBtn">Register Now</button>
        </form>
    </div>

    <!-- Thank You Section -->
    <div id="response-section">
        <div class="success-icon">✓</div>
        <h2>Thank You!</h2>
        <p>Registration Successful.</p>
        <p style="color: #666; line-height: 1.6;">
            Our support team will email you soon and add you to our official WhatsApp group.
        </p>
    </div>
</div>

<script>
    // 1. Automatically generate batch years 1955 to 2035
    const batchDropdown = document.getElementById('batchSelect');
    for (let year = 1955; year <= 2035; year++) {
        let option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        batchDropdown.appendChild(option);
    }

    // 2. Form Submission to Google Sheet
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxThxkRXrF-v8wIxgA3GJBTcFwPHP_6IF3OEtE5WqZgefH4cyIDCEP7UGZD-Jgnb5pQ/exec'; // <--- REPLACE THIS WITH YOUR URL
    const form = document.getElementById('registrationForm');
    const btn = document.getElementById('submitBtn');
    const formSection = document.getElementById('form-section');
    const responseSection = document.getElementById('response-section');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = "Processing...";

        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form)
        })
        .then(response => {
            formSection.style.display = 'none';
            responseSection.style.display = 'block';
        })
        .catch(error => {
            alert('Something went wrong. Please try again!');
            btn.disabled = false;
            btn.innerHTML = "Register Now";
        });
    });
</script>

</body>
</html>
